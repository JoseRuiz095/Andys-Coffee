# Isolated PostgreSQL for integration tests (see test/setup/test-env.ts).
# TLS is enabled with a local CA (test/db/certs, generated by generate-certs.sh) because
# src/config/prisma.ts only accepts verified TLS connections, like in production.
name: andys-coffee-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: andys
      POSTGRES_PASSWORD: andys_test_password
      POSTGRES_DB: andys_test
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    volumes:
      - ./certs:/certs-src:ro
    # Postgres requires the key to be owned by the server user with 0600 permissions,
    # which a Windows bind mount can't provide, so the certs are copied first.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/postgresql/certs &&
        cp /certs-src/server.crt /certs-src/server.key /var/lib/postgresql/certs/ &&
        chown postgres:postgres /var/lib/postgresql/certs/* &&
        chmod 600 /var/lib/postgresql/certs/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
        -c ssl_key_file=/var/lib/postgresql/certs/server.key
        -c fsync=off
        -c synchronous_commit=off
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andys -d andys_test"]
      interval: 2s
      timeout: 3s
      retries: 30
