<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LogoAndysVector.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andys Coffee</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('andy-theme')

          // Same choice as ThemeProvider: the saved theme, else the system preference (otherwise
          // a dark-mode system shows a light first paint and then switches).
          const preferredTheme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'

          document.documentElement.dataset.theme = preferredTheme
          document.documentElement.style.colorScheme = preferredTheme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
